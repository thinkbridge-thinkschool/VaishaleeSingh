# Day 27. Security headers for the document that actually executes script.
#
# WHY THIS FILE EXISTS AT ALL, when the API already sets these.
#
# The security pass added a SecurityHeadersMiddleware to QuotesApi, and that was
# the right thing to do -- but it protects API responses, and API responses are
# JSON. A Content-Security-Policy tells the browser where THIS DOCUMENT may load
# script from; on a JSON body there is no document and nothing to police. The
# page that loads seven JavaScript chunks and runs them is index.html, and
# index.html is served from here, by nginx, which was sending no headers at all.
#
# So the hardening was real but aimed one origin to the left. The browser only
# ever talks to this origin -- the API is reverse-proxied through /api/ above --
# which means this file, not the middleware, is what a browser enforces for the
# front end.
#
# WHY IT IS INCLUDED IN THREE PLACES AND NOT WRITTEN ONCE AT SERVER LEVEL.
# nginx's add_header does not merge across levels: a location block containing
# ANY add_header directive inherits NONE from its parent. This config has two
# such blocks (the hashed-asset cache block and the index.html no-cache block),
# so headers declared only at server level would apply to every request EXCEPT
# the two that matter most -- index.html and every script chunk. That failure is
# silent; the config loads, the site works, and the headers are simply absent on
# the exact responses they were written for. Hence one file, included wherever
# add_header appears.
#
# `always` so the headers are sent on error responses too. A 404 or a 502 is
# still a document a browser will render.

# The bundle is same-origin and self-contained: Angular's chunks, its styles,
# its fonts, and API calls that go through this same nginx. Nothing here loads
# from a CDN, which is what makes 'self' a policy rather than an aspiration.
#
# 'unsafe-inline' for style-src and NOT for script-src, and the asymmetry is the
# whole point. Angular injects component styles as inline <style> elements at
# runtime, so removing it blanks the application; script has no such need, and
# script is where the damage is. A CSP that allows inline script is a CSP that
# does not stop cross-site scripting.
#
# data: for img-src because the app inlines small images as data URIs.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

# Do not let the browser guess a content type. Without this, a file the server
# calls text/plain can be sniffed as script and executed.
add_header X-Content-Type-Options "nosniff" always;

# Clickjacking. frame-ancestors above is the modern control and X-Frame-Options
# is the one older browsers obey; both are cheap.
add_header X-Frame-Options "DENY" always;

# Referrer. A sign-in URL carries a returnUrl; there is no reason for any other
# site to learn it.
add_header Referrer-Policy "no-referrer" always;

add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

# HSTS. Container Apps terminates TLS and serves this app over HTTPS only, so
# this is a promise the deployment can keep. No preload directive: preloading is
# effectively irreversible and this is a training environment.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
