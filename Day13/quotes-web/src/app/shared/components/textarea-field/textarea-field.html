<div class="field">
  <label class="field__label" [attr.for]="inputId">
    <span>{{ label() }}</span>

    @if (isRequired()) {
      <span class="field__required" aria-hidden="true">*</span>
    }
  </label>

  <textarea
    #textarea
    class="field__input field__input--textarea"
    [class.field__input--invalid]="hasError()"
    [id]="inputId"
    [rows]="rows()"
    [formControl]="control()"
    [attr.placeholder]="placeholder() || null"
    [attr.maxlength]="maxLength()"
    [attr.aria-required]="isRequired() ? 'true' : null"
    [attr.aria-describedby]="describedBy()"
    [attr.aria-invalid]="hasError() ? 'true' : null"
  ></textarea>

  <div class="field__footer">
    <div class="field__messages">
      @if (hasError()) {
        <p class="field__error" [id]="errorId">{{ errorMessage() }}</p>
      } @else if (hint()) {
        <p class="field__hint" [id]="hintId">{{ hint() }}</p>
      }
    </div>

    @if (maxLength() !== null) {
      <!--
        aria-live="polite" would announce on every keystroke, which is worse than
        silence. It is described-by instead, so it is read when the field is
        focused and on demand.
      -->
      <p class="field__counter" [class.field__counter--warn]="isNearLimit()" [id]="counterId">
        {{ length() }} / {{ maxLength() }}
      </p>
    }
  </div>
</div>
