<app-modal [open]="open()" [busy]="adding()" title="Add a quote" (closed)="cancelled.emit()">
  <div class="picker">
    <app-text-field
      label="Filter"
      type="search"
      placeholder="Author or text"
      [control]="searchControl"
      [hint]="'Room for ' + remainingSlots() + ' more in this collection.'"
    />

    @if (errorMessage(); as message) {
      <p class="picker__error" role="alert">{{ message }}</p>
    }

    @if (loading()) {
      <app-loader variant="spinner" label="Loading quotes" />
    } @else if (quotes().length === 0) {
      <app-empty-state
        title="Nothing left to add"
        description="Every quote on this page of the API is already in this collection, or the filter excluded them all."
      />
    } @else {
      <p class="picker__select-hint">
        Select one or more quotes with checkboxes, then add them together.
      </p>

      <ul class="picker__list">
        @for (quote of quotes(); track quote.id) {
          <li class="picker__row">
            <!--
              The LABEL is the row, wrapping both the checkbox and the text.
              That is what makes the whole row clickable and keyboard-operable
              with no click handler of our own: a label activates the control it
              contains, and the control is a real focusable <input>.

              What was here before was a (click) on the <li> PLUS a label with a
              `for` pointing at the input inside it, and the two fought each
              other. Clicking the label forwarded activation to the input (toggle
              one) and the same click then bubbled to the <li> (toggle two), so
              the selection landed back where it started and the batch button
              stayed at "Add selected (0)" no matter how many rows were clicked.
              A stopPropagation() on the input covered a direct hit on the box
              itself, which is why it worked from some pixels and not others.
            -->
            <label class="picker__item">
              <span class="picker__check">
                <input
                  type="checkbox"
                  [disabled]="adding()"
                  [checked]="isSelected(quote.id)"
                  (change)="toggleSelection(quote.id, isChecked($event))"
                />
              </span>

              <span class="picker__text">
                <span class="picker__quote">{{ quote.text }}</span>
                <span class="picker__author">{{ quote.author }}</span>
              </span>
            </label>
          </li>
        }
      </ul>

    }
  </div>

  <!--
    THE ADD BUTTON LIVES IN THE FOOTER, and moving it here is a bug fix rather
    than a layout preference.

    It used to sit at the bottom of the dialog BODY, directly under the quote
    list. The body scrolls, the footer does not -- so with four or more
    candidates the primary action was below the fold while "Done" stayed pinned
    and visible. The dialog looked complete: you could tick several quotes,
    see them checked, and find no way to add them. It read as a broken button,
    and it was reported as one. Nothing was broken; the control was simply
    somewhere nobody would scroll to, because a pinned footer is exactly the
    signal that there is nothing below it.

    Add is the primary action, so it is first and prominent; Done is the way out
    and stays secondary. It is disabled rather than hidden when nothing is
    selected, so the count is always visible and the button never appears and
    disappears under the cursor.
  -->
  <ng-container ngProjectAs="[modalFooter]">
    <app-button
      [loading]="adding()"
      loadingLabel="Adding selected…"
      [disabled]="adding() || selectedCount() === 0"
      (pressed)="addSelectedQuotes()"
    >
      Add selected ({{ selectedCount() }})
    </app-button>

    <app-button variant="secondary" [disabled]="adding()" (pressed)="cancelled.emit()">
      Done
    </app-button>
  </ng-container>
</app-modal>
