<app-card [interactive]="true">
  <article
    class="quote"
    [style.background-image]="
      'linear-gradient(140deg, rgb(8 16 30 / 76%), rgb(10 26 45 / 60%)), url(' +
      backgroundImage() +
      ')'
    "
    [style.view-transition-name]="'quote-image-' + quote().id"
  >
    <!--
      A ROUTER LINK, not a button that opens a modal. Clicking a quote now
      navigates to /quotes/:id -- the same destination the separate expand
      icon used to be the only way to reach. That icon is gone: two controls
      on one card that both meant "look at this quote", one opening a modal
      and one navigating, is a choice the reader should not have to make.

      The View Transition on quote-image-<id> relies on this being a real
      navigation, which it now is for the whole card rather than for one
      small target in the corner.
    -->
    <a
      class="quote__open"
      [routerLink]="['/quotes', quote().id]"
      [attr.aria-label]="'Open the quote by ' + quote().author"
    >
      <!--
        A real <blockquote> with a <cite>: this is a quotation, and the elements
        that say so are also what make it navigable and translatable. A pair of
        styled divs would look identical and mean nothing.
      -->
      <blockquote class="quote__text">{{ quote().text }}</blockquote>

      <div class="quote__meta">
        <cite class="quote__author">{{ quote().author }}</cite>

        @if (owned()) {
          <app-badge tone="primary">yours</app-badge>
        }
      </div>
    </a>

    <footer class="quote__footer">


      @if (deletable()) {
        <app-button
          variant="danger"
          size="sm"
          [loading]="deleting()"
          loadingLabel="Deleting…"
          [ariaLabel]="'Delete the quote by ' + quote().author"
          (pressed)="deleteRequested.emit(quote())"
        >
          Delete
        </app-button>
      }
    </footer>
  </article>
</app-card>
