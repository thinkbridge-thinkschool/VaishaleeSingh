<app-card variant="outlined" padding="sm">
  <div class="filters">
    <div class="filters__search">
      <app-text-field
        label="Filter"
        type="search"
        placeholder="Author"
        [control]="searchControl"
        hint="Searches all quotes by author. Results are still paged for display."
      />
    </div>

    <div class="filters__size">
      <app-select-field label="Page size" [control]="sizeControl" [options]="sizeOptions()" />
    </div>
  </div>

  @if (isFiltering()) {
    <!-- aria-live announces the database-wide result count after searching. -->
    <p class="filters__count" aria-live="polite">
      {{ matchCount() }} quote{{ matchCount() === 1 ? '' : 's' }} found
    </p>
  }
</app-card>
