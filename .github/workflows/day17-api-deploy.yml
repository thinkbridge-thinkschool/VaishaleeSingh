name: day17-api-deploy

# Builds the Week-1 QuotesApi image and rolls it out to the Container App.
#
# WHY THIS EXISTS. Every previous deploy of this API was a local `azd deploy`
# followed by a corrective `az containerapp update`, and the gap between those
# two steps is where Day 17 lost an afternoon: the image in the registry and the
# image the Container App referenced drifted apart, one Container App ran a
# fortnight-old build while another ran the current one, and nothing in the repo
# recorded which was which. A workflow cannot drift from itself.
#
# It is separate from day17-swa-deploy.yml (front end) and from ci.yml (the .NET
# gate) for the same reason those two are separate from each other: a failure
# here should not be reported as a front-end failure, and a front-end change
# should not rebuild and redeploy the API.

on:
  push:
    # main only -- the Day 17 feature branch is merged, and production
    # rollouts should have exactly one source branch.
    branches: [main]
    paths:
      # The whole of Day7/piece2, not just QuotesApi/. The test projects are
      # this workflow's gate, so a change to them changes what the gate means
      # -- and with the narrower filter they did not trigger it. The commit
      # that fixed CrossCuttingTests silently did not re-run the deploy that
      # the test failure had blocked, which is the gate quietly not gating.
      - 'Day7/piece2/**'
      - '.github/workflows/day17-api-deploy.yml'
  workflow_dispatch:

concurrency:
  # A second push while a rollout is in flight should replace it, not race it --
  # two `containerapp update` calls interleaving can leave the app pointing at
  # the older of the two images.
  # Grouped by PR number for pull-request runs so a re-push replaces only that
  # PR's own in-flight run, and cancel-in-progress is off for main: a rollout to
  # production should queue behind the previous one, not cancel it. The SWA
  # workflow lost a production deploy to exactly that -- the run for a merge
  # commit on main was cancelled by a later request for the same group, so the
  # live site stayed on the previous commit with nothing red to show it.
  group: api-deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Day 24: every one of these was a literal naming a resource in subscription
# 80d20ef9-8bfa-45d7-a9d8-b6cf1f0c791e, whose credits are exhausted. They are
# repository VARIABLES rather than secrets -- a registry hostname and a resource
# group name are identifiers, not credentials, and putting them in Settings >
# Variables means moving subscription again is a settings change rather than a
# commit. Set them from the deployment stack's outputs; see
# Day24/docs/day24-deployment-stacks-azd-migration-plan.md, Phase E.
env:
  REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY_ENDPOINT }}
  IMAGE: quotes-api
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}

# OIDC federated credentials, not a stored service-principal secret. The whole
# point of Day 17 is that a deployment does not need a password sitting
# somewhere, and that applies to the pipeline as much as to the app: id-token
# lets GitHub mint a short-lived token Entra trusts, so there is no
# AZURE_CREDENTIALS blob to leak or rotate. AZURE_CLIENT_ID / TENANT_ID /
# SUBSCRIPTION_ID are identifiers, not secrets.
permissions:
  id-token: write
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # QuotesApi targets net10.0 -- see Day7/piece2/QuotesApi/QuotesApi.csproj.
          dotnet-version: '10.0.x'

      # The gate. This workflow can push an image to a registry and repoint a
      # live Container App, so it does not get to skip the tests -- a green
      # ci.yml on some other commit is not evidence about this one.
      - name: Restore
        run: dotnet restore Day7/piece2/QuotesApi.slnx

      - name: Build
        run: dotnet build Day7/piece2/QuotesApi.slnx --no-restore -c Release

      - name: Unit tests
        run: dotnet test Day7/piece2/Quotes.Tests.Unit --no-build -c Release

      - name: Integration tests
        run: dotnet test Day7/piece2/Quotes.Tests.Integration --no-build -c Release

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # `az acr login` writes a short-lived token into the Docker config, which
      # is where the .NET SDK's container tooling looks for registry
      # credentials. No admin username or password is involved -- the ACR admin
      # account is exactly the stored secret this deployment removed.
      - name: Sign in to the registry
        run: az acr login --name "${REGISTRY%%.*}"

      # There is no Dockerfile: .NET 8+ builds an OCI image straight from the
      # project, so there is nothing to keep in sync with the csproj. The tag is
      # the commit sha -- never `latest`, which is unversioned in practice and
      # cannot be rolled back to.
      - name: Build and push the image
        run: |
          dotnet publish Day7/piece2/QuotesApi/QuotesApi.csproj \
            -c Release \
            /t:PublishContainer \
            -p:ContainerRegistry="$REGISTRY" \
            -p:ContainerRepository="$IMAGE" \
            -p:ContainerImageTag="${GITHUB_SHA::12}"

      # The corrective step that used to be a manual `az containerapp update`
      # after every azd run, and the one most often forgotten.
      - name: Roll the Container App onto the new image
        run: |
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$REGISTRY/$IMAGE:${GITHUB_SHA::12}"

      # A green deploy step only means Azure accepted the request. It does not
      # mean the container started -- an unreachable target port, a failed image
      # pull and an unwritable database path all report success here and then
      # sit in Activating forever. All three of those actually happened. This
      # step is what turns them into a red build instead of a working pipeline
      # in front of a dead app.
      - name: Wait for the new revision to run
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            state=$(az containerapp revision list \
              --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
              --query "[?properties.active].properties.runningState | [0]" -o tsv)
            echo "attempt $attempt: runningState=$state"
            if [ "$state" = "Running" ]; then
              echo "Revision is running."
              exit 0
            fi
            if [ "$state" = "Failed" ] || [ "$state" = "Degraded" ]; then
              echo "::error::The new revision reported $state."
              az containerapp logs show --name "$CONTAINER_APP" \
                --resource-group "$RESOURCE_GROUP" --type system --tail 50 || true
              exit 1
            fi
            sleep 10
          done
          echo "::error::The new revision did not reach Running within five minutes."
          az containerapp logs show --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" --type system --tail 50 || true
          exit 1

      # The last thing that can still be wrong once the container is up: the
      # app is listening, but the path from the browser to it is broken. So the
      # check goes through the front door -- the Static Web App -- rather than
      # straight at the Container App.
      #
      # Hitting the Container App's own FQDN does not work and should not: it
      # has Container Apps authentication enabled with the Static Web App as its
      # linked identity provider, so unauthenticated traffic is answered with
      # 401 before it ever reaches the container. That is the point of the
      # linked backend -- the API is not meant to be callable from the internet
      # -- and an earlier version of this step curled it directly and read that
      # 401 as a failure. It was measuring the security control working.
      #
      # POST /api/auth/login with an empty body is the probe because it is
      # anonymous, side-effect free, and its 400 body is unmistakably this API's
      # own: AuthEndpointExtensions returns a validation problem naming the
      # "credentials" key. A 200 from the SPA shell would not contain it, so
      # this cannot pass on the SWA's fallback page the way a status-only check
      # could.
      - name: Smoke-test the API through the Static Web App
        env:
          SWA_ORIGIN: ${{ vars.SWA_ORIGIN }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            body=$(curl -s --max-time 15 -X POST "$SWA_ORIGIN/api/auth/login" \
              -H 'Content-Type: application/json' -d '{"email":"","password":""}' || true)
            echo "attempt $attempt: $(printf '%.200s' "$body")"
            case "$body" in
              *credentials*) echo "The API answered through the SWA."; exit 0 ;;
            esac
            sleep 10
          done
          echo "::error::The API did not answer through $SWA_ORIGIN within 100s."
          exit 1
