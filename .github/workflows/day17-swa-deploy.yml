name: day17-swa-deploy

# THIS WORKFLOW NO LONGER DEPLOYS ANYTHING. It is a front-end GATE.
#
# WHY, AND WHY THE NAME AND FILENAME ARE UNCHANGED.
#
# Day 17 built Day13/quotes-web and uploaded it to Azure Static Web Apps, which
# reverse-proxied /api/* to the Container App over a linked backend. Day 24 moved
# the whole deployment to a new subscription (the old one is out of credit), and
# that subscription's "Allowed resource deployment regions" policy permits five
# regions -- indonesiacentral, malaysiawest, indiasouthcentral, uaenorth,
# koreacentral -- while Microsoft.Web/staticSites is offered in only a handful of
# regions worldwide, none of them on that list. A Static Web App cannot be
# created here at all.
#
# So the SPA is now built into the API image and served by the Container App;
# see the "Angular front end" block in Day7/piece2/QuotesApi/Program.cs and the
# front-end steps in day17-api-deploy.yml. Deploying the front end is that
# workflow's job now, triggered by the Day13/quotes-web/** path.
#
# WHAT IS LOST, stated rather than glossed: the Static Web App was also the
# authentication boundary. The Container App had Container Apps authentication
# enabled with the SWA as its linked identity provider, so unauthenticated
# traffic never reached the container. Its ingress is now external by design and
# the API defends itself with its own authentication. That is a genuine
# reduction in defence-in-depth, forced by a policy this project does not
# control, and it is recorded as a deviation in
# Day24/docs/day24-deployment-stacks-azd-migration-plan.md. Also gone: pull
# request preview environments, which had no equivalent here.
#
# The name and filename stay put on purpose. They are what branch protection on
# main names as a required check, and renaming a required check makes it
# unsatisfiable -- every pull request then waits for a check that will never
# report. The rename belongs in the same change as the branch-protection
# update, and not in the middle of a subscription migration.
#
# What it still does is worth keeping: a broken Angular build, a failing test, a
# lint error or an oversized image should be caught on the pull request rather
# than at deploy time, and it should be reported as a front-end failure rather
# than folded into the .NET gate in ci.yml.

on:
  push:
    branches:
      - main
    paths:
      - 'Day13/quotes-web/**'
      - '.github/workflows/day17-swa-deploy.yml'
  pull_request:
    # `closed` is gone along with the close_pull_request job below it: there is
    # no preview environment left to tear down, and the job would have failed on
    # a missing deployment token while trying to close something that was never
    # opened.
    types: [opened, synchronize, reopened]
    branches: [ main ]
    paths:
      - 'Day13/quotes-web/**'
      - '.github/workflows/day17-swa-deploy.yml'
  workflow_dispatch:

concurrency:
  # Kept as it was, though the stakes are lower now that nothing is uploaded.
  # Pull-request runs group by PR number so a re-push replaces only that PR's own
  # in-flight run; cancel-in-progress is off for main.
  #
  # The original rule was group: swa-${{ github.ref }} with cancel-in-progress
  # true for every event, and it silently skipped a production deploy: the run
  # for a merge commit on main was cancelled two seconds in with "Canceling
  # since a higher priority waiting request for swa-refs/heads/main exists", so
  # main was never uploaded even though every check went green. A cancelled
  # production deploy is worse than a queued one -- it leaves the live site on
  # the previous commit with nothing red to show it. That lesson now lives in
  # day17-api-deploy.yml, which is what actually ships the front end.
  group: swa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: Day13/quotes-web

# No id-token and no secrets: this workflow no longer talks to Azure. The
# AZURE_STATIC_WEB_APPS_API_TOKEN secret it used to read can be deleted from the
# repository once the old subscription is decommissioned.
permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Day13/quotes-web/package-lock.json

      # npm ci, not npm install: CI must fail on a lockfile that has drifted
      # rather than quietly resolving something different from what was tested.
      #
      # This step failed the first time it was run on Linux: the lockfile had
      # been generated on Windows and was missing @emnapi/core and
      # @emnapi/runtime, which are pulled in only by the linux-x64 optional
      # dependency graph. Regenerating the lockfile on Linux added exactly those
      # two entries and removed nothing, so the Windows install is unaffected.
      # Worth knowing, because the symptom -- "npm ci can only install packages
      # when your package.json and package-lock.json are in sync" -- reads like a
      # dependency mistake rather than a platform one.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx ng test --watch=false

      # The image budget gate. Day 17 re-encoded public/ from 2.0 MB of
      # unoptimised JPEG down to 428 kB of WebP; the hero alone went from 417 kB
      # to 96.8 kB. Lighthouse >= 95 depends on that holding, and the
      # easiest way for it to stop holding is someone dropping a fresh
      # camera-original into public/. This fails the build instead.
      - name: Enforce image budget
        run: |
          python3 - <<'PYEOF'
          import pathlib, sys

          # kB ceilings, chosen just above the current sizes so a real regression
          # trips them and normal re-encoding noise does not.
          LIMITS = {'.webp': 110, '.png': 100}
          failures = []

          for path in pathlib.Path('public').rglob('*'):
              if not path.is_file():
                  continue
              limit = LIMITS.get(path.suffix.lower())
              if limit is None:
                  continue
              size = path.stat().st_size / 1024
              status = 'ok' if size <= limit else 'OVER'
              print(f'{status:>4}  {size:7.1f} kB  (limit {limit:4d})  {path}')
              if status == 'OVER':
                  failures.append(f'{path} is {size:.1f} kB, over the {limit} kB budget')

          # public/ is WebP-only as of Day 17. A .jpg or .avif reappearing here is
          # either an un-converted asset or a partial revert, and either way it
          # undoes the payload work silently -- so fail on it rather than ship it.
          for stale in list(pathlib.Path('public').rglob('*.jpg')) + list(pathlib.Path('public').rglob('*.avif')):
              failures.append(f'{stale} should be converted to .webp; public/ is WebP-only')

          if failures:
              for f in failures:
                  print(f'::error::{f}')
              sys.exit(1)

          print('Image budget OK.')
          PYEOF

      - name: Build
        run: npx ng build

      # The build output has to be exactly where day17-api-deploy.yml's staging
      # step expects it. That workflow asserts the same path, but it only runs on
      # Day7/piece2 and Day13/quotes-web changes to main -- so an angular.json
      # change that relocates the output would pass here and fail there, at
      # deploy time. Asserting it in both places costs two lines.
      - name: Confirm the bundle is where the API build expects it
        run: |
          test -f dist/quotes-web/browser/index.html \
            || { echo "::error::dist/quotes-web/browser/index.html missing. day17-api-deploy.yml copies that exact path into QuotesApi/spa/; if angular.json moved it, update both."; exit 1; }
          echo "Bundle present at dist/quotes-web/browser/index.html"

      # staticwebapp.config.json is now inert -- nothing reads it, because there
      # is no Static Web App. It is deliberately NOT deleted: it is the record of
      # the routing rules the SWA enforced, and the one that mattered most
      # (navigationFallback.exclude containing /api/*) is now enforced by the
      # regex in Program.cs's MapFallbackToFile. Deleting the file would lose the
      # only written statement of why that regex exists.
      #
      # This step exists so the file cannot rot into looking authoritative.
      - name: Note the inert SWA config
        run: |
          if [ -f public/staticwebapp.config.json ]; then
            echo "::notice::public/staticwebapp.config.json is retained for reference only -- no Static Web App exists in this subscription. Its /api/* fallback exclusion is now implemented by MapFallbackToFile in Program.cs."
          fi
