name: ci

# Day 4 -- Wire CI with GitHub Actions.
#
# Runs on every push (any branch, for fast feedback while working) and on
# every pull request into main (the check branch protection on main
# requires -- see the "Required for merging into main" note at the bottom
# of this file for how that's wired up outside of this YAML).
#
# This replaces the old dotnet-tests.yml from Day 3: that workflow
# repeated the same restore/build/test steps once per .csproj because
# there was no solution file to point a single `dotnet test` at. Day 4
# adds Day5/piece2/QuotesApi.slnx for exactly that reason, so this
# workflow can restore/build/test everything -- QuotesApi itself plus all
# four test projects -- in one pass instead of four copy-pasted ones.
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Day5/piece2/QuotesApi.slnx

      - name: Build
        run: dotnet build Day5/piece2/QuotesApi.slnx --no-restore --configuration Release

      # trx gives a structured, per-test pass/fail record (viewable in
      # most .NET-aware tools); the coverage collector is Coverlet's
      # built-in "XPlat Code Coverage" data collector, scoped down to just
      # QuotesApi's own assembly via coverlet.runsettings -- see that
      # file for why. The coverage collector writes each test project's
      # run into its own auto-generated GUID subfolder under TestResults/,
      # so those never collide. The trx logger does NOT get that same
      # per-project uniquification if you pin an exact LogFileName -- a
      # fixed name is shared across every project's run against this
      # solution, so each later project's trx silently overwrites the
      # one before it, and only the last project's results would survive
      # to the upload step. Deliberately NOT setting LogFileName here so
      # each project's run gets its own default (unique) filename instead.
      - name: Test
        run: >
          dotnet test Day5/piece2/QuotesApi.slnx
          --no-build
          --configuration Release
          --logger trx
          --collect:"XPlat Code Coverage"
          --settings Day5/piece2/coverlet.runsettings
          --results-directory Day5/piece2/TestResults

      # if: always() on every step from here down: if a test genuinely
      # fails, the Test step above already fails the job (that's the "any
      # test failure" half of Day 4's requirement) -- but the whole point
      # of collecting trx/coverage output is to be able to see WHY it
      # failed, so those artifacts still need to upload even then.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: Day5/piece2/TestResults/**/*.trx
          if-no-files-found: error

      - name: Upload raw coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports-raw
          path: Day5/piece2/TestResults/**/coverage.cobertura.xml
          if-no-files-found: error

      # Five test projects means five separate Cobertura files (one per
      # project's test run) -- merge them into one before checking a
      # single coverage number against the threshold below. This is the
      # one third-party action in this workflow; ReportGenerator itself
      # is a long-established, widely used OSS tool, but I couldn't
      # verify the exact current major-version tag for its GitHub Action
      # wrapper from the sandbox this was written in (no network access
      # to check) -- if this step fails specifically on "action not
      # found" rather than a real coverage problem, that tag is why.
      - name: Merge coverage reports
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@v5
        with:
          reports: 'Day5/piece2/TestResults/**/coverage.cobertura.xml'
          targetdir: 'Day5/piece2/CoverageReport'
          reporttypes: 'Cobertura;MarkdownSummaryGithub'

      - name: Upload merged coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-merged
          path: Day5/piece2/CoverageReport

      - name: Post coverage summary
        if: always()
        run: cat Day5/piece2/CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY" || true

      # The actual 70% gate. Deliberately not a second third-party action
      # here -- Cobertura's line-rate attribute is a stable, documented
      # part of its schema, and parsing one number out of one XML file is
      # simple enough that owning it directly means no dependency on
      # another action's exact flag names for the one step that actually
      # blocks a merge. No if: always() here on purpose: if the Test step
      # above already failed, this step is skipped and the job is already
      # red for that reason, which is the correct, simpler signal.
      - name: Enforce coverage threshold
        run: |
          python3 - << 'PYEOF'
          import sys
          import xml.etree.ElementTree as ET

          THRESHOLD = 70.0
          path = "Day5/piece2/CoverageReport/Cobertura.xml"

          root = ET.parse(path).getroot()
          percent = float(root.attrib["line-rate"]) * 100

          print(f"QuotesApi line coverage: {percent:.2f}% (required: {THRESHOLD}%)")

          if percent < THRESHOLD:
              print(f"::error::Coverage {percent:.2f}% is below the required {THRESHOLD}% threshold.")
              sys.exit(1)
          PYEOF

  # Day 5: the image is built from the project itself (no Dockerfile), so
  # the container build can break from an ordinary csproj edit with nothing
  # in the test suite noticing. This job is the guard: it fails the PR
  # rather than the deploy.
  #
  # Separate job, not another step on `test`, so the two run concurrently
  # and a container failure is distinguishable from a test failure at a
  # glance. It deliberately does NOT depend on `test` -- knowing both
  # answers on a red PR is more useful than saving a runner minute.
  container:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # linux-musl, not linux: the base image is Alpine, and a glibc RID
      # ships a glibc build of the SQLite native library into a musl image.
      # That combination builds and starts and then dies on first database
      # access. See docs/containerising.md section 1.
      #
      # Builds the image into the runner's local Docker daemon. Nothing is
      # pushed: publishing to a registry needs credentials that do not
      # belong in this repository, and the property this job protects is
      # "the image still builds and starts", not "it is distributable".
      - name: Build container image
        run: >
          dotnet publish Day5/piece2/QuotesApi
          --os linux-musl
          --arch x64
          --configuration Release
          /t:PublishContainer

      - name: Report image size
        run: |
          docker images quotes-api --format '{{.Repository}}:{{.Tag}}  {{.Size}}' \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # A built image is not a working one. This starts the container the
      # way the docs say to and waits for the readiness probe to answer,
      # which exercises the whole boot path: options validation, the
      # startup EF migration, and SQLite actually being able to write to
      # the path the csproj points it at. Every one of those has already
      # failed once during this piece.
      #
      # The signing key here is a throwaway that exists only for this
      # 30-second container. It is not used anywhere else and grants
      # nothing beyond it.
      - name: Start the container and wait for readiness
        run: |
          docker run -d --name quotes-api-ci -p 8080:8080 \
            -e Jwt__Secret="ci-only-throwaway-signing-key-not-used-anywhere-else" \
            quotes-api:0.1.0

          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health/ready > /tmp/ready.json 2>/dev/null; then
              echo "ready after ${attempt}s"; cat /tmp/ready.json; exit 0
            fi
            sleep 1
          done

          echo "::error::Container never became ready. Logs follow."
          docker logs quotes-api-ci
          exit 1

      # Proves the app answering is THIS app, not a proxy or a stray
      # container that happened to bind 8080.
      - name: Confirm the running app identifies itself
        run: |
          curl -fsS http://localhost:8080/health | tee /tmp/health.json
          grep -q '"service":"QuotesApi"' /tmp/health.json

      - name: Container logs
        if: always()
        run: docker logs quotes-api-ci || true

      - name: Stop the container
        if: always()
        run: docker rm -f quotes-api-ci || true


  # Day 23: the infrastructure is Bicep now, and Bicep breaks the same way code
  # does -- a renamed module output, a parameter that no longer exists, a typo in
  # a .bicepparam file. None of that is visible until someone deploys, which is
  # the worst possible moment to find out.
  #
  # Separate job for the same reason as `container`: an infra failure should be
  # distinguishable from a test failure at a glance, and both answers are more
  # useful on a red PR than a saved runner minute.
  #
  # NOTE: this job checks Day7/piece2/infra, which is the current tree. The
  # `test` and `container` jobs above still point at Day5/piece2 -- a known gap
  # (see the repo README, "Working in this repo"), deliberately not fixed here
  # so that this PR stays about the infrastructure.
  infra:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The az CLI ships bicep, and `az bicep install` pins a known-good build
      # rather than whatever the runner image happens to carry.
      - name: Install Bicep
        run: az bicep install && az bicep version

      # Compiles the whole module graph. Catches a bad cross-module reference,
      # which is the failure this refactor made newly possible.
      - name: Build main.bicep
        run: az bicep build --file Day7/piece2/infra/main.bicep --stdout > /dev/null

      # bicepconfig.json turns several rules up to error, including
      # no-unused-params and outputs-should-not-contain-secrets.
      - name: Lint
        run: az bicep lint --file Day7/piece2/infra/main.bicep

      # THE STEP THAT EARNS ITS KEEP. A .bicepparam file is typed against the
      # template it `using`s, so a parameter that was renamed or removed fails
      # here. The old main.parameters.json would have accepted the same typo in
      # silence and surfaced it as a deployment error.
      # JWT_SECRET is read by readEnvironmentVariable() at COMPILE time. The
      # parameter files fall back to an empty string when it is unset, so these
      # steps would pass without it -- it is set anyway so CI compiles the same
      # shape a real deployment does rather than the fallback path. The value is
      # a throwaway that signs nothing and reaches no environment.
      - name: Type-check the dev parameter file
        env:
          JWT_SECRET: ci-only-throwaway-signing-key-not-used-anywhere-else
        run: az bicep build-params --file Day7/piece2/infra/main.dev.bicepparam --outfile /dev/null

      - name: Type-check the prod parameter file
        env:
          JWT_SECRET: ci-only-throwaway-signing-key-not-used-anywhere-else
        run: az bicep build-params --file Day7/piece2/infra/main.prod.bicepparam --outfile /dev/null

      # No `what-if` here: it needs a subscription and credentials this
      # repository does not hold. The plan for both environments is captured by
      # hand in Day23/verification/ instead, which is honest about being a
      # point-in-time artifact rather than a continuous check.


# Required for merging into main:
# GitHub branch protection (Settings -> Branches -> main, in the repo's
# web UI) is what actually blocks a PR from merging on a red run of this
# workflow -- there is no YAML for that, it has to be configured once in
# the repo settings, and only after this workflow has run at least once
# (GitHub only lists a check as selectable once it has appeared in a run).
